apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mynginx.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "mynginx.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "mynginx.name" . }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}
